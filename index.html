<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Pro Reaction Trainer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-color: #0a0a0a;
            --text-color: #e0e0e0;
            --panel-bg: rgba(15, 15, 15, 0.95);
            --accent: #e10600;
            --green: #00ff66;
            --border: rgba(255,255,255,0.1);
        }
        :root[data-theme='light'] {
            --bg-color: #f0f0f0;
            --text-color: #111;
            --panel-bg: rgba(255, 255, 255, 0.95);
            --border: rgba(0,0,0,0.1);
        }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* SCREENS */
        .screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .screen.active { display: flex; }

        /* HOME */
        #home-screen { background: linear-gradient(135deg, #0a0a0a, #1a1a1a); }
        .logo { font-size: 72px; font-weight: 900; color: var(--accent); letter-spacing: -3px; text-transform: uppercase; transform: skew(-10deg); text-shadow: 0 0 40px rgba(225,6,0,0.5); }
        .tagline { letter-spacing: 8px; font-size: 12px; opacity: 0.6; margin-top: 10px; text-transform: uppercase; }
        .menu-buttons { display: flex; flex-direction: column; gap: 12px; width: 280px; margin-top: 50px; }
        .btn-main { background: var(--accent); color: white; border: none; padding: 18px; font-size: 18px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; border-radius: 8px; cursor: pointer; box-shadow: 0 6px 0 #8a0400; transition: all 0.1s; }
        .btn-main:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #8a0400; }
        .btn-main:active { transform: translateY(4px); box-shadow: 0 2px 0 #8a0400; }
        .btn-sec { background: rgba(255,255,255,0.05); color: var(--text-color); border: 1px solid var(--border); padding: 14px; font-size: 14px; font-weight: 600; text-transform: uppercase; border-radius: 8px; cursor: pointer; }
        .btn-sec:hover { background: rgba(255,255,255,0.1); }
        .stats-preview { display: flex; gap: 30px; margin-top: 40px; padding: 15px 30px; background: rgba(255,255,255,0.03); border-radius: 50px; border: 1px solid var(--border); }
        .stat-item { text-align: center; }
        .stat-item small { display: block; font-size: 10px; color: #888; text-transform: uppercase; }
        .stat-item strong { font-size: 22px; font-weight: 800; }

        /* GAME */
        #game-screen { cursor: pointer; }
        .top-bar { position: fixed; top: 0; left: 0; right: 0; padding: 20px; display: flex; justify-content: space-between; z-index: 100; }
        .back-btn { background: var(--panel-bg); border: 1px solid var(--border); color: var(--text-color); padding: 10px 20px; border-radius: 25px; font-size: 12px; font-weight: 700; cursor: pointer; text-transform: uppercase; }
        .icon-btn { background: var(--panel-bg); border: 1px solid var(--border); color: var(--text-color); width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font-size: 20px; }

        .gantry { background: linear-gradient(180deg, #1a1a1a, #111); padding: 40px 60px; border-radius: 20px; border-bottom: 6px solid #000; box-shadow: 0 25px 60px rgba(0,0,0,0.8); display: flex; gap: 25px; }
        .light-col { display: flex; flex-direction: column; gap: 12px; background: #050505; padding: 12px; border-radius: 40px; border: 1px solid #222; }
        .light { width: 50px; height: 50px; border-radius: 50%; background: #222; border: 3px solid #000; transition: all 0.05s; }
        .light.on { background: #ff0000; box-shadow: 0 0 40px #ff0000, 0 0 80px #ff0000; }

        .hud { margin-top: 50px; text-align: center; }
        .time-display { font-size: 64px; font-weight: 900; }
        .benchmark-text { font-size: 16px; color: var(--accent); margin-top: 10px; font-style: italic; }
        .instruction { font-size: 14px; color: #666; margin-top: 8px; }

        .track { position: fixed; bottom: 60px; left: 0; right: 0; height: 100px; border-top: 3px solid #333; }
        .car { position: absolute; bottom: 20px; left: 10%; width: 160px; transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94); }

        .side-panel { position: fixed; right: 20px; top: 50%; transform: translateY(-50%); width: 240px; background: var(--panel-bg); border: 1px solid var(--border); border-radius: 16px; padding: 20px; backdrop-filter: blur(20px); }
        .grid-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .mini-stat { background: rgba(255,255,255,0.03); padding: 10px; border-radius: 8px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .mini-stat small { font-size: 9px; color: #666; text-transform: uppercase; display: block; margin-bottom: 4px; }
        .mini-stat strong { font-size: 16px; font-weight: 800; }
        .history-list { max-height: 120px; overflow-y: auto; font-size: 12px; }
        .history-item { display: flex; justify-content: space-between; padding: 5px 8px; background: rgba(255,255,255,0.02); border-radius: 4px; margin-bottom: 4px; }
        .history-item.best { color: var(--green); font-weight: bold; }

        /* MODALS */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 200; backdrop-filter: blur(5px); }
        .modal.active { display: flex; }
        .modal-content { background: var(--panel-bg); border: 1px solid var(--border); border-radius: 20px; padding: 30px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; }
        .modal h2 { text-align: center; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; font-size: 18px; }
        .livery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 10px; }
        .livery-card { cursor: pointer; border: 2px solid transparent; border-radius: 10px; padding: 10px; text-align: center; transition: all 0.2s; background: rgba(255,255,255,0.02); }
        .livery-card:hover { border-color: rgba(255,255,255,0.3); }
        .livery-card.selected { border-color: var(--green); }
        .livery-swatch { width: 100%; height: 50px; border-radius: 6px; margin-bottom: 8px; }
        .livery-name { font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--border); }
        .toggle { position: relative; width: 50px; height: 28px; }
        .toggle input { opacity: 0; width: 0; height: 0; }
        .toggle-slider { position: absolute; cursor: pointer; inset: 0; background: #444; border-radius: 28px; transition: 0.3s; }
        .toggle-slider:before { content: ""; position: absolute; height: 22px; width: 22px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.3s; }
        .toggle input:checked + .toggle-slider { background: var(--green); }
        .toggle input:checked + .toggle-slider:before { transform: translateX(22px); }

        @keyframes confetti-fall { to { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
        .confetti { position: fixed; top: -10px; width: 10px; height: 10px; animation: confetti-fall 3s ease-out forwards; pointer-events: none; }
        @keyframes pulse-green { 0%, 100% { color: var(--green); } 50% { color: #00cc55; text-shadow: 0 0 20px var(--green); } }
        .pb-flash { animation: pulse-green 1s infinite; }
    </style>
</head>
<body data-theme="dark">

    <!-- TOP BAR (Game Only) -->
    <div class="top-bar" id="top-bar" style="display:none;">
        <button class="back-btn" onclick="goHome()">← Menu</button>
        <div style="display:flex;gap:10px;">
            <button class="icon-btn" id="sound-btn" onclick="toggleSound()">🔊</button>
            <button class="icon-btn" onclick="toggleFullscreen()">⛶</button>
        </div>
    </div>

    <!-- HOME SCREEN -->
    <div class="screen active" id="home-screen">
        <div class="logo">F1 PRO</div>
        <div class="tagline">Reaction Trainer</div>
        
        <div class="menu-buttons">
            <button class="btn-main" onclick="startGame()">Start Race</button>
            <button class="btn-sec" onclick="openModal('livery-modal')">Garage</button>
            <button class="btn-sec" onclick="openModal('settings-modal')">Settings</button>
        </div>

        <div class="stats-preview">
            <div class="stat-item"><small>Career Best</small><strong id="home-pb">--</strong></div>
            <div class="stat-item"><small>Avg Speed</small><strong id="home-avg">--</strong></div>
            <div class="stat-item"><small>Starts</small><strong id="home-count">0</strong></div>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div class="screen" id="game-screen">
        <div class="gantry">
            <div class="light-col"><div class="light"></div><div class="light"></div></div>
            <div class="light-col"><div class="light"></div><div class="light"></div></div>
            <div class="light-col"><div class="light"></div><div class="light"></div></div>
            <div class="light-col"><div class="light"></div><div class="light"></div></div>
            <div class="light-col"><div class="light"></div><div class="light"></div></div>
        </div>

        <div class="hud">
            <div class="time-display" id="status">CLICK TO START</div>
            <div class="benchmark-text" id="benchmark-text"></div>
            <div class="instruction">Press Spacebar or Click when lights go out</div>
        </div>

        <div class="track">
            <svg class="car" id="car" viewBox="0 0 200 60">
                <path d="M10,45 L190,45 L180,25 L50,25 Z" fill="#e10600"/>
                <rect x="30" y="40" width="30" height="15" rx="5" fill="#111"/>
                <rect x="140" y="40" width="30" height="15" rx="5" fill="#111"/>
                <path d="M20,25 L40,5 L50,5 L50,25 Z" fill="#333"/>
                <rect x="80" y="20" width="20" height="10" rx="2" fill="#fff"/>
            </svg>
        </div>

        <div class="side-panel">
            <div class="grid-stats">
                <div class="mini-stat"><small>BEST</small><strong id="pb-val">--</strong></div>
                <div class="mini-stat"><small>LAST 5 AVG</small><strong id="avg5-val">--</strong></div>
                <div class="mini-stat"><small>CONSISTENCY</small><strong id="cons-val">--</strong></div>
                <div class="mini-stat"><small>ATTEMPTS</small><strong id="count-val">0</strong></div>
            </div>
            <div class="history-list" id="history-list"></div>
            <div style="display:flex;gap:8px;margin-top:12px;">
                <button class="btn-sec" style="flex:1;" onclick="copyStats()">Share</button>
                <button class="btn-sec" style="flex:1;" onclick="exportCSV()">CSV</button>
            </div>
        </div>
    </div>

    <!-- LIVERY MODAL -->
    <div class="modal" id="livery-modal">
        <div class="modal-content">
            <h2>F1 Garage</h2>
            <div class="livery-grid" id="livery-grid"></div>
            <button class="btn-main" style="width:100%;margin-top:20px;padding:12px;" onclick="closeModal('livery-modal')">Done</button>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <h2>Settings</h2>
            <div class="setting-row">
                <span>Light Theme</span>
                <label class="toggle"><input type="checkbox" id="theme-toggle" onchange="toggleTheme()"><span class="toggle-slider"></span></label>
            </div>
            <div class="setting-row">
                <span>Vibration (Mobile)</span>
                <label class="toggle"><input type="checkbox" id="vibrate-toggle" checked><span class="toggle-slider"></span></label>
            </div>
            <div class="setting-row" style="border:none;">
                <span style="color:var(--accent);">Factory Reset</span>
                <button class="btn-sec" style="border-color:var(--accent);color:var(--accent);" onclick="resetAll()">Reset Data</button>
            </div>
        </div>
    </div>

    <script>
        // GAME STATE
        let state = 'IDLE';
        let startTime = 0;
        let timeoutId = null;
        let history = JSON.parse(localStorage.getItem('f1_history') || '[]');
        let soundEnabled = localStorage.getItem('f1_sound') !== 'false';
        let currentLivery = localStorage.getItem('f1_livery') || 'redbull';
        let theme = localStorage.getItem('f1_theme') || 'dark';

        // F1 DRIVER BENCHMARKS
        const benchmarks = [
            { ms: 120, name: 'AI Bot Level', driver: 'Robot' },
            { ms: 150, name: 'Max Verstappen Pace', driver: 'Red Bull - 2023 Japan GP' },
            { ms: 168, name: 'Lewis Hamilton Pace', driver: 'Mercedes - 2020 British GP' },
            { ms: 185, name: 'Charles Leclerc Pace', driver: 'Ferrari - 2022 Monaco GP' },
            { ms: 210, name: 'Lando Norris Pace', driver: 'McLaren - 2021 Russian GP' },
            { ms: 235, name: 'Fernando Alonso Pace', driver: 'Aston Martin - 2023 Saudi GP' },
            { ms: 350, name: 'Average Human', driver: 'Standard' },
            { ms: 500, name: 'Safety Car Response', driver: 'Slow' }
        ];

        // TEAM LIVERIES
        const liveries = {
            redbull: { name: 'Red Bull', color: '#0600EF' },
            ferrari: { name: 'Ferrari', color: '#DC0000' },
            mercedes: { name: 'Mercedes', color: '#00D2BE' },
            mclaren: { name: 'McLaren', color: '#FF8700' },
            alpine: { name: 'Alpine', color: '#0090FF' },
            astonmartin: { name: 'Aston Martin', color: '#006F62' },
            williams: { name: 'Williams', color: '#005AFF' },
            haas: { name: 'Haas', color: '#FFFFFF' },
            alphatauri: { name: 'AlphaTauri', color: '#2B4562' },
            alfaromeo: { name: 'Alfa Romeo', color: '#C41E3A' }
        };

        // DOM ELEMENTS
        const lights = document.querySelectorAll('.light');
        const car = document.getElementById('car');
        const statusEl = document.getElementById('status');
        const benchmarkEl = document.getElementById('benchmark-text');
        const topBar = document.getElementById('top-bar');

        // INIT
        function init() {
            document.body.setAttribute('data-theme', theme);
            document.getElementById('theme-toggle').checked = theme === 'light';
            updateUI();
            applyLivery(currentLivery);
            renderLiveryOptions();
            document.getElementById('sound-btn').textContent = soundEnabled ? '🔊' : '🔇';
            
            // Game controls
            document.getElementById('game-screen').addEventListener('click', handleClick);
            window.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); handleClick(); } });
        }

        function handleClick(e) {
            if (!document.getElementById('game-screen').classList.contains('active')) return;
            if (e && (e.target.closest('.side-panel') || e.target.matches('[class*="btn"]'))) return;

            if (state === 'IDLE') startLights();
            else if (state === 'READY') react();
            else if (state === 'WAITING') jumpStart();
        }

        function startGame() {
            document.getElementById('home-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            topBar.style.display = 'flex';
            resetGame();
        }

        function goHome() {
            document.getElementById('game-screen').classList.remove('active');
            document.getElementById('home-screen').classList.add('active');
            topBar.style.display = 'none';
            resetGame();
        }

        function resetGame() {
            state = 'IDLE';
            clearTimeout(timeoutId);
            statusEl.textContent = 'CLICK TO START';
            statusEl.className = 'time-display';
            benchmarkEl.textContent = '';
            car.style.transform = 'translateX(0)';
            lights.forEach(l => l.classList.remove('on'));
        }

        async function startLights() {
            state = 'WAITING';
            statusEl.textContent = 'PREPARE...';
            benchmarkEl.textContent = '';
            car.style.transform = 'translateX(0)';
            lights.forEach(l => l.classList.remove('on'));

            for (let i = 0; i < 5; i++) {
                await new Promise(r => setTimeout(r, 1000));
                if (state !== 'WAITING') return;
                lights[i*2].classList.add('on');
                lights[i*2+1].classList.add('on');
                playBeep(400 + (i * 60));
                if (navigator.vibrate && document.getElementById('vibrate-toggle').checked) navigator.vibrate(25);
            }

            if (state !== 'WAITING') return;
            state = 'READY';
            
            const delay = Math.random() * 2500 + 500;
            timeoutId = setTimeout(() => {
                if (state !== 'READY') return;
                lights.forEach(l => l.classList.remove('on'));
                startTime = performance.now();
                statusEl.textContent = 'GO!';
                statusEl.style.color = '#00ff66';
                playBeep(900, 'triangle');
            }, delay);
        }

        function react() {
            const time = Math.round(performance.now() - startTime);
            state = 'IDLE';
            statusEl.style.color = '';
            
            // Save attempt
            history.unshift(time);
            if (history.length > 50) history.pop();
            localStorage.setItem('f1_history', JSON.stringify(history));
            
            // Check PB
            const best = Math.min(...history);
            const isNewPB = history.indexOf(best) === 0;
            if (isNewPB && history.length > 1) {
                statusEl.innerHTML = `${time}ms <span style="font-size:24px;">(NEW PB!)</span>`;
                statusEl.classList.add('pb-flash');
                spawnConfetti();
            } else {
                statusEl.textContent = `${time}ms`;
            }
            
            // Benchmark
            const bench = benchmarks.find(b => time <= b.ms) || benchmarks[benchmarks.length - 1];
            benchmarkEl.innerHTML = `<strong>${bench.name}</strong><br><small>${bench.driver}</small>`;
            
            // Launch car
            const progress = Math.min(80, Math.max(10, (500 - time) / 5));
            car.style.transform = `translateX(${progress}vw)`;
            
            updateUI();
        }

        function jumpStart() {
            clearTimeout(timeoutId);
            state = 'IDLE';
            statusEl.textContent = 'JUMP START!';
            statusEl.style.color = '#ff0000';
            benchmarkEl.textContent = 'Too early - wait for lights out!';
            playBeep(200, 'sawtooth');
            lights.forEach(l => l.classList.remove('on'));
            setTimeout(() => {
                statusEl.style.color = '';
                statusEl.textContent = 'CLICK TO START';
            }, 1500);
        }

        function updateUI() {
            const count = history.length;
            document.getElementById('home-count').textContent = count;
            document.getElementById('count-val').textContent = count;
            
            if (count === 0) return;
            
            const best = Math.min(...history);
            const avg = Math.round(history.reduce((a,b) => a+b, 0) / count);
            const last5 = history.slice(0, 5);
            const avg5 = Math.round(last5.reduce((a,b) => a+b, 0) / last5.length);
            const variance = history.reduce((sum, val) => sum + Math.pow(val - avg, 2), 0) / count;
            const stdDev = Math.sqrt(variance);
            
            document.getElementById('home-pb').textContent = `${best}ms`;
            document.getElementById('home-avg').textContent = `${avg}ms`;
            document.getElementById('pb-val').textContent = `${best}ms`;
            document.getElementById('avg5-val').textContent = `${avg5}ms`;
            document.getElementById('cons-val').textContent = `±${Math.round(stdDev)}ms`;
            
            // History list
            const listEl = document.getElementById('history-list');
            listEl.innerHTML = history.slice(0, 10).map((t, i) => `
                <div class="history-item ${t === best ? 'best' : ''}">
                    <span>#${count - i}</span>
                    <strong>${t}ms</strong>
                </div>
            `).join('');
        }

        function applyLivery(key) {
            const livery = liveries[key];
            if (!livery) return;
            document.querySelector('#car path').setAttribute('fill', livery.color);
            document.documentElement.style.setProperty('--accent', livery.color);
            document.querySelectorAll('.livery-card').forEach(card => {
                card.classList.toggle('selected', card.dataset.key === key);
            });
        }

        function renderLiveryOptions() {
            const grid = document.getElementById('livery-grid');
            grid.innerHTML = Object.entries(liveries).map(([key, l]) => `
                <div class="livery-card ${key === currentLivery ? 'selected' : ''}" 
                     data-key="${key}" onclick="selectLivery('${key}')">
                    <div class="livery-swatch" style="background:${l.color};"></div>
                    <div class="livery-name">${l.name}</div>
                </div>
            `).join('');
        }

        function selectLivery(key) {
            currentLivery = key;
            localStorage.setItem('f1_livery', key);
            applyLivery(key);
        }

        function toggleTheme() {
            theme = document.getElementById('theme-toggle').checked ? 'light' : 'dark';
            document.body.setAttribute('data-theme', theme);
            localStorage.setItem('f1_theme', theme);
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            localStorage.setItem('f1_sound', soundEnabled);
            document.getElementById('sound-btn').textContent = soundEnabled ? '🔊' : '🔇';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        }

        function copyStats() {
            if (history.length === 0) return alert('No attempts yet!');
            const best = Math.min(...history);
            const text = `🏎️ F1 PRO REACTION\nBest: ${best}ms\nAttempts: ${history.length}\nTry it: ${window.location.href}`;
            navigator.clipboard.writeText(text).then(() => alert('Stats copied!'));
        }

        function exportCSV() {
            if (history.length === 0) return alert('No data to export!');
            const csv = 'Attempt,Time(ms)\n' + history.map((t, i) => `${history.length-i},${t}`).join('\n');
            const blob = new Blob([csv], {type: 'text/csv'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'f1_reaction_data.csv';
            a.click();
        }

        function resetAll() {
            if (!confirm('Clear ALL career data? This cannot be undone.')) return;
            history = [];
            localStorage.removeItem('f1_history');
            updateUI();
            closeModal('settings-modal');
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        // Close modals on outside click
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('active'); });
        });

        function playBeep(freq = 440, type = 'sine') {
            if (!soundEnabled) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
                osc.connect(gain).connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.1);
            } catch(e) {}
        }

        function spawnConfetti() {
            const colors = ['#e10600', '#00ff66', '#ffd700', '#0090ff'];
            for (let i = 0; i < 30; i++) {
                const div = document.createElement('div');
                div.className = 'confetti';
                div.style.left = Math.random() * 100 + 'vw';
                div.style.background = colors[Math.floor(Math.random() * colors.length)];
                div.style.animationDelay = Math.random() * 0.5 + 's';
                div.style.width = div.style.height = Math.random() * 8 + 4 + 'px';
                document.body.appendChild(div);
                setTimeout(() => div.remove(), 3000);
            }
        }

        // Initialize game
        init();
    </script>
</body>
</html>
