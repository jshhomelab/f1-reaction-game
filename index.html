<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Pro Reaction Trainer</title>
    <style>
        :root {
            --bg-color: #0e0e0e;
            --text-color: #d1d1d1;
            --panel-bg: rgba(20, 20, 20, 0.95);
            --gantry-bg: #1a1a1a;
            --light-off: #222;
            --light-on: #ff0909;
            --border-color: #333;
            --subtext-color: #777;
            --toggle-active: #34c759;
            --f1-red: #e10600;
            --accent-color: #e10600;
        }
        :root[data-theme='light'] {
            --bg-color: #f4f4f4;
            --text-color: #1a1a1a;
            --panel-bg: rgba(255, 255, 255, 0.95);
            --gantry-bg: #e0e0e0;
            --light-off: #ccc;
            --border-color: #ddd;
            --subtext-color: #666;
        }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            cursor: default;
            user-select: none;
            overflow: hidden;
            transition: background 0.3s;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Screen Management */
        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .screen.active { display: flex; }

        /* Home Screen */
        #home-screen {
            background: radial-gradient(circle at center, #1a1a1a 0%, #0e0e0e 100%);
        }
        #home-screen h1 {
            font-size: 64px;
            font-weight: 900;
            margin: 0;
            letter-spacing: -2px;
            color: var(--f1-red);
            text-transform: uppercase;
            font-style: italic;
            text-shadow: 0 5px 15px rgba(225, 6, 0, 0.3);
        }
        #home-screen .subtitle {
            font-size: 14px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--subtext-color);
            margin-bottom: 50px;
        }
        .menu-btns {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 300px;
        }
        .main-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 18px;
            font-size: 18px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 4px 0 #8a0400;
        }
        .main-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #8a0400; }
        .main-btn:active { transform: translateY(2px); box-shadow: 0 0 0 #8a0400; }
        .secondary-btn {
            background: var(--panel-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
        }
        .secondary-btn:hover { background: var(--gantry-bg); }
        .career-stat-preview {
            margin-top: 40px;
            display: flex;
            gap: 20px;
            background: rgba(255,255,255,0.03);
            padding: 15px 30px;
            border-radius: 50px;
            border: 1px solid var(--border-color);
        }
        .preview-box { text-align: center; }
        .preview-box small { display: block; font-size: 9px; color: var(--subtext-color); text-transform: uppercase; }
        .preview-box strong { font-size: 20px; font-weight: 900; }

        /* Game Screen */
        #game-screen { cursor: pointer; }
        #back-to-menu {
            position: fixed;
            top: 20px; left: 20px;
            z-index: 150;
            background: var(--panel-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* Corner Controls */
        .corner-controls {
            position: fixed;
            top: 20px; right: 20px;
            display: flex; gap: 10px;
            z-index: 100;
        }
        .btn-icon {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 18px;
        }

        /* Gantry & HUD */
        #game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        #gantry {
            background: #111;
            padding: 30px 45px;
            border-radius: 15px;
            border-bottom: 8px solid #222;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            display: flex; gap: 20px;
            z-index: 10;
        }
        .light-column {
            display: flex; flex-direction: column; gap: 10px;
            background: #050505; padding: 10px; border-radius: 30px;
        }
        .light {
            width: 45px; height: 45px; border-radius: 50%;
            background: #111; transition: background 0.05s;
            border: 2px solid #000;
        }
        .light.active {
            background: var(--light-on);
            box-shadow: 0 0 30px var(--light-on), inset 0 0 10px rgba(255,255,255,0.5);
        }
        #track-container {
            width: 100vw; height: 120px;
            position: fixed; bottom: 50px;
            border-bottom: 4px solid #333;
        }
        #car {
            position: absolute; bottom: 10px; left: 20%;
            width: 180px; height: auto;
            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 5;
        }
        #hud { margin-top: 40px; text-align: center; min-height: 100px; }
        #status { font-size: 32px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; margin: 0; }
        #rating-text { font-size: 14px; color: var(--subtext-color); margin-top: 5px; }
        #benchmark { font-size: 13px; font-style: italic; color: var(--f1-red); text-align: center; margin-top: 5px; height: 18px; font-weight: bold; }

        /* Stats Panel */
        #side-panel {
            position: fixed; right: 20px; top: 80px;
            width: 260px; background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px; padding: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex; flex-direction: column; gap: 12px;
            backdrop-filter: blur(10px);
        }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-card {
            background: rgba(0,0,0,0.2); padding: 8px; border-radius: 6px;
            text-align: center; border: 1px solid rgba(255,255,255,0.05);
        }
        .stat-card small { display: block; font-size: 9px; text-transform: uppercase; color: #666; margin-bottom: 2px; }
        .stat-card strong { font-size: 14px; font-weight: 800; }
        #sparkline-container { height: 40px; width: 100%; margin: 5px 0; }
        #history-list { list-style: none; padding: 0; margin: 0; max-height: 150px; overflow-y: auto; font-size: 12px; }
        .history-item { display: flex; justify-content: space-between; padding: 4px 8px; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .history-item.pb { color: var(--toggle-active); font-weight: bold; }

        /* Modals */
        .modal {
            display: none;
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85); z-index: 200;
            align-items: center; justify-content: center;
            backdrop-filter: blur(5px);
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 15px; padding: 25px;
            width: 90%; max-width: 500px;
            max-height: 80vh; overflow-y: auto;
        }
        .livery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
        .livery-option {
            display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 10px;
            border: 2px solid transparent; border-radius: 8px; cursor: pointer; background: rgba(0,0,0,0.1);
        }
        .livery-option.selected { border-color: var(--toggle-active); }
        .livery-preview { width: 80px; height: 40px; border-radius: 5px; }
        .settings-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 0; border-bottom: 1px solid var(--border-color);
        }

        /* iOS Toggle Switch */
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #444; transition: .4s; border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--toggle-active); }
        input:checked + .slider:before { transform: translateX(18px); }

        /* Confetti Animation */
        .confetti {
            position: fixed; top: -10px; width: 8px; height: 8px;
            pointer-events: none; animation: fall 3s linear forwards;
        }
        @keyframes fall { to { transform: translateY(100vh) rotate(360deg); opacity: 0; } }
    </style>
</head>
<body>

    <!-- Shared Top Right Controls -->
    <div class="corner-controls">
        <button class="btn-icon" id="sound-btn" title="Toggle Sound">🔊</button>
        <button class="btn-icon" id="fullscreen-btn" title="Fullscreen">⛶</button>
    </div>

    <!-- HOME SCREEN -->
    <div id="home-screen" class="screen active">
        <h1>F1 PRO</h1>
        <div class="subtitle">Reaction Trainer</div>

        <div class="menu-btns">
            <button class="main-btn" onclick="showScreen('game-screen')">Start Race</button>
            <button class="secondary-btn" onclick="openModal('livery-modal')">Garage (Livery)</button>
            <button class="secondary-btn" onclick="openModal('settings-modal')">Settings</button>
        </div>

        <div class="career-stat-preview">
            <div class="preview-box">
                <small>Career Best</small>
                <strong id="home-pb">--</strong>
            </div>
            <div class="preview-box">
                <small>Avg Speed</small>
                <strong id="home-avg">--</strong>
            </div>
            <div class="preview-box">
                <small>Starts</small>
                <strong id="home-count">0</strong>
            </div>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="screen">
        <button id="back-to-menu" onclick="showScreen('home-screen')">← Menu</button>
        
        <div id="game-area">
            <div id="gantry">
                <div class="light-column"><div class="light"></div><div class="light"></div></div>
                <div class="light-column"><div class="light"></div><div class="light"></div></div>
                <div class="light-column"><div class="light"></div><div class="light"></div></div>
                <div class="light-column"><div class="light"></div><div class="light"></div></div>
                <div class="light-column"><div class="light"></div><div class="light"></div></div>
            </div>

            <div id="hud">
                <h1 id="status">CLICK TO START</h1>
                <div id="rating-text">EYES ON THE GANTRY</div>
                <div id="benchmark"></div>
            </div>
        </div>

        <div id="track-container">
            <svg id="car" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
                <path id="car-body" d="M10,45 L190,45 L180,25 L50,25 Z" fill="#e10600" />
                <rect id="car-rear-wheel" x="30" y="40" width="30" height="15" rx="5" fill="#111" />
                <rect id="car-front-wheel" x="140" y="40" width="30" height="15" rx="5" fill="#111" />
                <path id="car-wing" d="M20,25 L40,5 L50,5 L50,25 Z" fill="#333" />
                <rect id="car-helmet" x="80" y="20" width="20" height="10" rx="2" fill="#fff" opacity="0.8" />
            </svg>
        </div>

        <div id="side-panel">
            <div class="stats-grid">
                <div class="stat-card"><small>Personal Best</small><strong id="pb-val">--</strong></div>
                <div class="stat-card"><small>Last 5 Avg</small><strong id="avg5-val">--</strong></div>
                <div class="stat-card"><small>Consistency</small><strong id="cons-val">--</strong></div>
                <div class="stat-card"><small>Attempts</small><strong id="count-val">0</strong></div>
            </div>
            <div id="sparkline-container">
                <svg id="sparkline" width="100%" height="40" preserveAspectRatio="none"></svg>
            </div>
            <ul id="history-list"></ul>
            <div style="display: flex; gap: 5px; margin-top: 5px;">
                <button class="secondary-btn" id="copy-btn" style="flex: 1; font-size: 10px;">Share</button>
                <button class="secondary-btn" id="csv-btn" style="flex: 1; font-size: 10px;">CSV</button>
                <button class="secondary-btn" id="reset-btn" style="font-size: 10px;">🗑️</button>
            </div>
        </div>
    </div>

    <!-- LIVERY MODAL -->
    <div id="livery-modal" class="modal">
        <div class="modal-content">
            <h2 style="text-align: center; margin-top: 0;">F1 Garage</h2>
            <div class="livery-grid" id="livery-grid"></div>
            <button class="main-btn" style="width: 100%; margin-top: 20px; padding: 10px;" onclick="closeModal('livery-modal')">Done</button>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <h2 style="text-align: center; margin-top: 0;">Settings</h2>
            <div class="settings-row">
                <span>Theme: <b id="theme-label">Dark Mode</b></span>
                <label class="switch">
                    <input type="checkbox" id="theme-toggle">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="settings-row">
                <span>Vibration (Mobile)</span>
                <label class="switch">
                    <input type="checkbox" id="vibrate-toggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="settings-row">
                <span>Clear All Data</span>
                <button class="secondary-btn" style="border-color: var(--f1-red); color: var(--f1-red);" onclick="resetData()">Factory Reset</button>
            </div>
            <button class="main-btn" style="width: 100%; margin-top: 20px; padding: 10px;" onclick="closeModal('settings-modal')">Close</button>
        </div>
    </div>

    <script>
        let state = 'IDLE';
        let startTime;
        let timeout;
        let history = JSON.parse(localStorage.getItem('f1_pro_history') || '[]');
        let soundEnabled = true;
        let currentLivery = localStorage.getItem('f1_livery') || 'redbull';
        let theme = localStorage.getItem('f1_theme') || 'dark';

        const liveries = {
            redbull: { name: 'Red Bull', primary: '#0600EF', secondary: '#FF0000', wheels: '#000000', wing: '#000000' },
            ferrari: { name: 'Ferrari', primary: '#DC0000', secondary: '#FFFFFF', wheels: '#000000', wing: '#000000' },
            mercedes: { name: 'Mercedes', primary: '#00D2BE', secondary: '#FFFFFF', wheels: '#000000', wing: '#000000' },
            mclaren: { name: 'McLaren', primary: '#FF8700', secondary: '#000000', wheels: '#000000', wing: '#000000' },
            alpine: { name: 'Alpine', primary: '#0090FF', secondary: '#FFFFFF', wheels: '#000000', wing: '#000000' },
            astonmartin: { name: 'Aston Martin', primary: '#006F62', secondary: '#FFFFFF', wheels: '#000000', wing: '#000000' },
            alphatauri: { name: 'AlphaTauri', primary: '#2B4562', secondary: '#FFFFFF', wheels: '#000000', wing: '#000000' },
            alpharomeo: { name: 'Alfa Romeo', primary: '#C41E3A', secondary: '#FFFFFF', wheels: '#000000', wing: '#000000' },
            williams: { name: 'Williams', primary: '#005AFF', secondary: '#FFFFFF', wheels: '#000000', wing: '#000000' },
            haas: { name: 'Haas', primary: '#FFFFFF', secondary: '#FF0000', wheels: '#000000', wing: '#000000' }
        };

        const benchmarks = [
            { ms: 120, name: "🤖 AI Bot (0.120s)" },
            { ms: 150, name: "Max Verstappen - 2023 Japan GP (0.150s)" },
            { ms: 175, name: "Lewis Hamilton - 2020 British GP (0.175s)" },
            { ms: 190, name: "Charles Leclerc - 2022 Monaco GP (0.190s)" },
            { ms: 210, name: "Lando Norris - 2021 Russian GP (0.210s)" },
            { ms: 350, name: "Average Human (0.350s)" },
            { ms: 500, name: "Safety Car Driver (0.500s)" }
        ];

        // Elements
        const lights = document.querySelectorAll('.light');
        const car = document.getElementById('car');
        const carBody = document.getElementById('car-body');
        const status = document.getElementById('status');
        const ratingText = document.getElementById('rating-text');
        const benchmarkText = document.getElementById('benchmark');
        const sparkline = document.getElementById('sparkline');
        const themeToggle = document.getElementById('theme-toggle');
        const themeLabel = document.getElementById('theme-label');

        // Initialize
        function init() {
            document.documentElement.setAttribute('data-theme', theme);
            themeToggle.checked = (theme === 'light');
            updateThemeLabel();
            updateUI();
            applyLivery(currentLivery);
            renderLiveryOptions();
        }
        init();

        // --- Screen Navigation ---
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            if (screenId === 'home-screen') {
                state = 'IDLE';
                clearTimeout(timeout);
                lights.forEach(l => l.classList.remove('active'));
            }
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        // --- Core Gameplay ---
        document.getElementById('game-screen').addEventListener('click', (e) => {
            if (e.target.closest('#side-panel') || e.target.closest('#back-to-menu')) return;
            handleTrigger();
        });
        window.addEventListener('keydown', (e) => { 
            if (e.code === 'Space' && document.getElementById('game-screen').classList.contains('active')) {
                e.preventDefault(); handleTrigger(); 
            }
        });

        function handleTrigger() {
            if (state === 'IDLE') startLights();
            else if (state === 'READY') react();
            else if (state === 'LIGHTS_UP' || state === 'WAITING') jumpStart();
        }

        async function startLights() {
            state = 'LIGHTS_UP';
            status.innerText = "PREPARE...";
            ratingText.innerText = "EYES ON THE GANTRY";
            benchmarkText.innerText = "";
            car.style.transform = "translateX(0)";
            lights.forEach(l => l.classList.remove('active'));

            for (let i = 0; i < 5; i++) {
                if (state !== 'LIGHTS_UP') return;
                [lights[i*2], lights[i*2+1]].forEach(l => l.classList.add('active'));
                playBeep(400 + (i * 80), 0.1);
                if (navigator.vibrate && document.getElementById('vibrate-toggle').checked) navigator.vibrate(25);
                await new Promise(r => setTimeout(r, 1000));
            }

            if (state !== 'LIGHTS_UP') return;
            state = 'WAITING';
            timeout = setTimeout(() => {
                if (state === 'WAITING') {
                    lights.forEach(l => l.classList.remove('active'));
                    state = 'READY';
                    startTime = performance.now();
                    status.innerText = "GO GO GO!";
                    playBeep(880, 0.2, 'triangle');
                }
            }, Math.random() * 3000 + 300);
        }

        function react() {
            const time = Math.round(performance.now() - startTime);
            state = 'IDLE';
            status.innerText = `${time}ms`;
            
            if (history.length === 0 || time < Math.min(...history)) {
                status.innerText += " (NEW PB!)";
                confetti();
            }

            const bench = benchmarks.find(b => time <= b.ms) || benchmarks[benchmarks.length-1];
            benchmarkText.innerText = `Pace: ${bench.name}`;
            ratingText.innerText = getRating(time);
            car.style.transform = `translateX(${Math.max(100, 2000 - time)}px)`;

            history.unshift(time);
            if (history.length > 50) history.pop();
            localStorage.setItem('f1_pro_history', JSON.stringify(history));
            updateUI();
        }

        function jumpStart() {
            clearTimeout(timeout);
            state = 'IDLE';
            status.innerText = "JUMP START!";
            status.style.color = "#ff0909";
            ratingText.innerText = "10s STOP-GO PENALTY";
            playBeep(150, 0.4, 'sawtooth');
            lights.forEach(l => l.classList.remove('active'));
            setTimeout(() => { if (state === 'IDLE') status.style.color = ""; }, 1500);
        }

        // --- UI & Stats ---
        function updateUI() {
            const count = history.length;
            document.getElementById('count-val').innerText = count;
            document.getElementById('home-count').innerText = count;
            
            if (count > 0) {
                const pb = Math.min(...history);
                const avgAll = Math.round(history.reduce((a,b)=>a+b,0) / count);
                const last5 = history.slice(0, 5);
                const avg5 = Math.round(last5.reduce((a,b)=>a+b,0) / last5.length);
                
                const squareDiffs = history.map(v => Math.pow(v - avgAll, 2));
                const stdDev = Math.sqrt(squareDiffs.reduce((a,b)=>a+b,0) / count);

                document.getElementById('pb-val').innerText = `${pb}ms`;
                document.getElementById('home-pb').innerText = `${pb}ms`;
                document.getElementById('avg5-val').innerText = `${avg5}ms`;
                document.getElementById('home-avg').innerText = `${avgAll}ms`;
                document.getElementById('cons-val').innerText = `±${Math.round(stdDev)}ms`;

                drawSparkline();
                renderHistory();
            }
        }

        function drawSparkline() {
            if (history.length < 2) return;
            const points = history.slice(0, 20).reverse();
            const max = Math.max(...points), min = Math.min(...points);
            const range = max - min || 1;
            let d = `M 0 ${40 - ((points[0]-min)/range)*30}`;
            points.forEach((p, i) => {
                const x = i * (100 / (points.length - 1));
                const y = 35 - ((p - min) / range) * 30;
                d += ` L ${x} ${y}`;
            });
            sparkline.innerHTML = `<path d="${d}%" fill="none" stroke="var(--accent-color)" stroke-width="2" />`;
        }

        function renderHistory() {
            const pb = Math.min(...history);
            document.getElementById('history-list').innerHTML = history.slice(0, 10).map((t, i) => `
                <li class="history-item ${t === pb ? 'pb' : ''}">
                    <span>#${history.length - i}</span>
                    <strong>${t}ms</strong>
                </li>`).join('');
        }

        function applyLivery(key) {
            const l = liveries[key];
            if (!l) return;
            carBody.setAttribute('fill', l.primary);
            document.getElementById('car-rear-wheel').setAttribute('fill', l.wheels);
            document.getElementById('car-front-wheel').setAttribute('fill', l.wheels);
            document.getElementById('car-wing').setAttribute('fill', l.wing);
            document.getElementById('car-helmet').setAttribute('fill', l.secondary);
            document.documentElement.style.setProperty('--accent-color', l.primary);
            document.querySelectorAll('.livery-option').forEach(o => o.classList.toggle('selected', o.dataset.key === key));
        }

        function renderLiveryOptions() {
            document.getElementById('livery-grid').innerHTML = Object.entries(liveries).map(([k, l]) => `
                <div class="livery-option" data-key="${k}" onclick="selectLivery('${k}')">
                    <div class="livery-preview" style="background: ${l.primary}; border: 1px solid #444;"></div>
                    <span style="font-size: 10px; margin-top: 5px;">${l.name}</span>
                </div>`).join('');
        }

        function selectLivery(k) {
            currentLivery = k;
            localStorage.setItem('f1_livery', k);
            applyLivery(k);
        }

        function toggleTheme() {
            theme = themeToggle.checked ? 'light' : 'dark';
            localStorage.setItem('f1_theme', theme);
            document.documentElement.setAttribute('data-theme', theme);
            updateThemeLabel();
        }

        function updateThemeLabel() {
            themeLabel.innerText = theme === 'light' ? 'Light Mode ☀️' : 'Dark Mode 🌙';
        }

        function playBeep(f, d, t='sine') {
            if (!soundEnabled) return;
            try {
                const ctx = new AudioContext();
                const o = ctx.createOscillator(), g = ctx.createGain();
                o.type = t; o.frequency.value = f;
                g.gain.setValueAtTime(0.05, ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + d);
                o.connect(g); g.connect(ctx.destination);
                o.start(); o.stop(ctx.currentTime + d);
            } catch(e) {}
        }

        function confetti() {
            for(let i=0; i<40; i++) {
                const div = document.createElement('div');
                div.className = 'confetti';
                div.style.left = Math.random()*100+'vw';
                div.style.background = ['#e10600', '#fff', '#ffd700'][i%3];
                div.style.width = Math.random()*10+5+'px';
                div.style.height = div.style.width;
                div.style.animationDuration = Math.random()*2+1+'s';
                document.body.appendChild(div);
                setTimeout(()=>div.remove(), 3000);
            }
        }

        // Button Handlers
        document.getElementById('sound-btn').onclick = (e) => {
            soundEnabled = !soundEnabled;
            e.target.innerText = soundEnabled ? '🔊' : '🔇';
        };
        document.getElementById('theme-toggle').onchange = toggleTheme;
        document.getElementById('fullscreen-btn').onclick = () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        };
        document.getElementById('reset-btn').onclick = resetData;
        function resetData() {
            if(confirm("Factory Reset? All career stats will be wiped.")) {
                history = []; localStorage.removeItem('f1_pro_history'); updateUI();
            }
        }
        document.getElementById('csv-btn').onclick = () => {
            const csv = "Attempt,Time(ms)\n" + history.map((t,i)=>`${history.length-i},${t}`).join("\n");
            const blob = new Blob([csv], {type: 'text/csv'});
            const a = document.createElement('a');
            a.href = window.URL.createObjectURL(blob);
            a.download = 'f1_reaction_data.csv'; a.click();
        };
        document.getElementById('copy-btn').onclick = () => {
            const text = `🏎️ F1 PRO CAREER\nPB: ${document.getElementById('pb-val').innerText}\nStarts: ${history.length}`;
            navigator.clipboard.writeText(text).then(()=>alert("Career Stats Copied!"));
        };
    </script>
</body>
</html>
